<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ product.name }} | Sassy Store</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .details-wrapper {
            max-width: 900px;
            margin: 40px auto;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 35px;
            box-shadow: var(--shadow-xl);
        }

        .details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 35px;
            align-items: center;
        }

        .details-img-box {
            background: #080c14;
            border: 1px solid var(--border-color-light);
            border-radius: var(--radius);
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 380px;
            overflow: hidden;
        }

        .details-img-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .price-highlight {
            font-size: 2rem;
            font-weight: 800;
            color: #38bdf8;
            margin: 15px 0;
            display: block;
        }

        @media (max-width: 768px) {
            .details-grid {
                grid-template-columns: 1fr;
            }

            .details-img-box {
                height: 280px;
            }
        }
    </style>
</head>

<body>
    <!-- Top Header -->
    <header>
        <div class="nav-container">
            <a href="/" class="brand-logo">
                <span class="brand-badge">✨</span>
                <span>Sassy Store</span>
            </a>
            <nav>
                <a href="/products">← Back to Products</a>
                <a href="/cart">🛒 Cart</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="details-wrapper">
            <div class="details-grid">
                <div class="details-img-box">
                    <img src="{{ url_for('static', filename='uploads/product_images/' + product.image) }}"
                        alt="{{ product.name }}">
                </div>

                <div>
                    <span class="product-category">{{ product.category }}</span>
                    <h1 class="h2 mb-3" style="color: #ffffff; margin-top: 10px;">{{ product.name }}</h1>

                    <span class="price-highlight">₹{{ "%.2f"|format(product.price|float) if product.price else "0.00"
                        }}</span>

                    <p style="color: #cbd5e1; font-size: 1rem; margin-bottom: 25px; line-height: 1.7;">
                        {{ product.description }}
                    </p>

                    <div style="display: flex; gap: 12px; flex-wrap: wrap;">
                        <a href="/add-to-cart/{{ product.product_id }}" class="btn btn-primary"
                            style="padding: 13px 28px; font-size: 1rem;">
                            🛒 Add to Cart
                        </a>
                        <a href="/products" class="btn btn-secondary" style="padding: 13px 24px;">
                            Browse More
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="footer-content">
            <p>&copy; 2026 Sassy Store. All rights reserved.</p>
        </div>
    </footer>
</body>

</html>
