<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ product.name }} | Admin Preview</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .preview-wrapper {
            max-width: 800px;
            margin: 40px auto 60px;
            padding: 0 20px;
        }

        .preview-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 35px;
            box-shadow: var(--shadow-xl);
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 30px;
            align-items: center;
        }

        .preview-img-box {
            background: #080c14;
            border: 1px solid var(--border-color-light);
            border-radius: var(--radius);
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 280px;
        }

        .preview-img-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        @media (max-width: 680px) {
            .preview-card {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <!-- Top Header -->
    <header>
        <div class="nav-container">
            <a href="/admin-dashboard" class="brand-logo">
                <span class="brand-badge" style="background: linear-gradient(135deg, #0f172a, #334155);">🛡️</span>
                <span>Admin Console</span>
            </a>
            <nav>
                <a href="/admin/item-list">← Inventory</a>
                <a href="/admin-dashboard">Dashboard</a>
            </nav>
        </div>
    </header>

    <main class="container preview-wrapper">
        <div class="preview-card">
            <div class="preview-img-box">
                <img src="/static/uploads/product_images/{{ product.image }}" alt="{{ product.name }}">
            </div>

            <div>
                <span class="badge" style="background: rgba(99, 102, 241, 0.2); color: #a5b4fc; margin-bottom: 12px; display: inline-block;">
                    {{ product.category }}
                </span>

                <h1 class="h3" style="color: #ffffff; margin-bottom: 8px;">{{ product.name }}</h1>
                <div style="font-size: 1.8rem; font-weight: 800; color: #38bdf8; margin-bottom: 16px;">
                    ₹{{ "%.2f"|format(product.price|float) if product.price else "0.00" }}
                </div>

                <p style="color: #cbd5e1; line-height: 1.6; margin-bottom: 25px;">
                    {{ product.description }}
                </p>

                <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                    <a href="/admin/update-item/{{ product.product_id }}" class="btn btn-primary" style="padding: 10px 20px;">
                        ✏️ Edit Product
                    </a>
                    <a href="/admin/item-list" class="btn btn-secondary" style="padding: 10px 20px;">
                        ← Back to Inventory
                    </a>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="footer-content">
            <p>&copy; 2026 Sassy Store Administrative Console.</p>
        </div>
    </footer>
</body>

</html>
